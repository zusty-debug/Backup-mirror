name: Build and Push JustRunMy Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to JustRunMy registry
        uses: docker/login-action@v3
        with:
          registry: jdr-d62ra75i.justrunmy.app
          username: ${{ secrets.JR_REGISTRY_USER }}
          password: ${{ secrets.JR_REGISTRY_PASSWORD }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: jdr-d62ra75i.justrunmy.app/d62ra75i:v1_autodeploy
