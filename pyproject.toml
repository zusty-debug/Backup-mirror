[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-media-mirror-bot"
version = "0.1.0"
description = "Private Telegram media-only backup and mirror bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Telegram Media Mirror Bot"}]
dependencies = [
  "telethon>=1.37,<2",
  "pydantic-settings>=2.5,<3",
  "cryptography>=43,<46",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
telegram-media-mirror = "app.main:main"

[tool.setuptools]
packages = ["app"]
